<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b" />
      <stop offset="50%" stop-color="#6c2d82" />
      <stop offset="100%" stop-color="#2d0b38" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9" />
      <stop offset="100%" stop-color="#0984e3" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#a29bfe" stroke-width="2" stroke-opacity="0.4" />

  <!-- Emacs GNU G-curve / E glyph background hint -->
  <path d="M 38 64 C 38 48 50 36 66 36 C 78 36 86 42 90 48" fill="none" stroke="#e056fd" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Bookmark Ribbon Shape -->
  <path d="M 44 26 L 84 26 C 86.2 26 88 27.8 88 30 L 88 98 L 64 80 L 40 98 L 40 30 C 40 27.8 41.8 26 44 26 Z" 
        fill="url(#ribbonGrad)" filter="url(#dropShadow)" />

  <!-- Golden / White Emacs-style star / sparkle inside the ribbon -->
  <polygon points="64,42 67.5,51 77,51.5 69.5,57.5 72,67 64,61.5 56,67 58.5,57.5 51,51.5 60.5,51" 
           fill="#ffffff" />
           
  <!-- Small Buku 'B' accent -->
  <path d="M 64 68 L 64 74 M 60 71 L 68 71" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
</svg>
